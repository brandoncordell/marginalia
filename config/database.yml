# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  pragmas:
    # WAL: concurrent readers + one writer. Essential for a web app.
    journal_mode: WAL
    # NORMAL is safe under WAL and far faster than FULL on slow storage (SD cards).
    synchronous: NORMAL
    # Wait up to 5s for a lock instead of erroring immediately.
    busy_timeout: 5000
    # Enforce FK constraints (off by default in SQLite).
    foreign_keys: true
    # Page cache. Negative = KiB. -20000 ≈ 20 MB. Drop to -8000 (~8 MB) on a 512MB Pi.
    cache_size: -20000
    # Memory-mapped I/O. 128 MB. Set to 0 on very low-RAM devices.
    mmap_size: 134217728
    # Keep temp tables/indexes in RAM, not on the SD card.
    temp_store: MEMORY
    # Checkpoint the WAL after ~1000 pages to keep it from growing unbounded.
    wal_autocheckpoint: 1000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
